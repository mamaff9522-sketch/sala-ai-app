name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalaAI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # A permanent download link for the newest app:
      # https://github.com/<owner>/<repo>/releases/latest/download/SalaAI.apk
      - name: Publish APK download link
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FIXED_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SalaAI.apk
          TAG="build-${{ github.run_number }}"
          if [ "$HAS_FIXED_KEY" = "true" ]; then
            NOTE="Signed with the fixed Sala AI key: installs over the previous version as an update."
          else
            NOTE="Signed with a one-off key (ANDROID_KEYSTORE_PASSWORD secret not set): uninstall the old app before installing."
          fi
          gh release create "$TAG" SalaAI.apk \
            --repo "${{ github.repository }}" \
            --title "Sala AI 1.9.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s) — $NOTE" \
            --latest
