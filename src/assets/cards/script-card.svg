<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <radialGradient id="bg1" cx="70%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1B0E3B" />
      <stop offset="60%" stop-color="#090A24" />
      <stop offset="100%" stop-color="#020412" />
    </radialGradient>
    <linearGradient id="border1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" />
      <stop offset="50%" stop-color="#7B2CFF" />
      <stop offset="100%" stop-color="#FF35D4" />
    </linearGradient>
    <linearGradient id="icon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#00D8FF" />
    </linearGradient>
    <linearGradient id="scroll1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="512" rx="40" fill="url(#bg1)" />

  <!-- Stars -->
  <circle cx="180" cy="90" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="360" cy="180" r="2" fill="#38BDF8" opacity="0.8" />
  <circle cx="820" cy="70" r="3.5" fill="#E879F9" opacity="0.9" filter="url(#glow1)" />
  <circle cx="940" cy="380" r="2.5" fill="#00D8FF" opacity="0.8" />
  <circle cx="480" cy="430" r="2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="720" cy="460" r="3" fill="#C084FC" opacity="0.9" />

  <!-- Light Swirls -->
  <path d="M 400 450 Q 650 490 850 350 T 980 200" fill="none" stroke="#7B2CFF" stroke-width="4" opacity="0.5" filter="url(#glow1)" />
  <path d="M 450 440 Q 700 450 900 320 T 1000 150" fill="none" stroke="#00D8FF" stroke-width="3" opacity="0.6" filter="url(#glow1)" />

  <!-- The Glowing Scroll -->
  <g transform="translate(420, 45)">
    <path d="M 40 40 Q 180 10 320 20 L 400 310 Q 250 370 170 350 Q 120 340 100 290 Z" fill="url(#scroll1)" opacity="0.92" filter="url(#glow1)" />
    <!-- Scroll Upper Roll -->
    <ellipse cx="60" cy="45" rx="35" ry="18" fill="#38BDF8" transform="rotate(-15 60 45)" />
    <ellipse cx="60" cy="45" rx="28" ry="12" fill="#0F172A" transform="rotate(-15 60 45)" />
    <!-- Scroll Lower Roll -->
    <ellipse cx="230" cy="355" rx="42" ry="22" fill="#C084FC" transform="rotate(-10 230 355)" filter="url(#glow1)" />
    <ellipse cx="230" cy="355" rx="32" ry="14" fill="#1E1B4B" transform="rotate(-10 230 355)" />

    <!-- Text Lines -->
    <line x1="160" y1="110" x2="310" y2="90" stroke="#0284C7" stroke-width="7" stroke-linecap="round" />
    <line x1="150" y1="145" x2="330" y2="125" stroke="#0284C7" stroke-width="7" stroke-linecap="round" />
    <line x1="155" y1="180" x2="320" y2="160" stroke="#2563EB" stroke-width="7" stroke-linecap="round" />
    <line x1="160" y1="215" x2="340" y2="195" stroke="#2563EB" stroke-width="7" stroke-linecap="round" />
    <line x1="165" y1="250" x2="330" y2="230" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" />
    <line x1="170" y1="285" x2="310" y2="265" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Futuristic Cyber Pen Writing -->
  <g transform="translate(680, 80) rotate(32)">
    <rect x="0" y="0" width="34" height="280" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5" />
    <rect x="2" y="180" width="30" height="70" fill="url(#border1)" />
    <rect x="0" y="80" width="34" height="8" fill="#F7C94A" />
    <rect x="0" y="160" width="34" height="8" fill="#F7C94A" />
    <polygon points="4,250 30,250 17,295" fill="#F7C94A" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="17" cy="295" r="16" fill="#FFFFFF" filter="url(#glow1)" />
    <circle cx="17" cy="295" r="8" fill="#00D8FF" />
  </g>

  <!-- Left Icon Box -->
  <rect x="52" y="52" width="112" height="112" rx="28" fill="url(#icon1)" filter="url(#glow1)" />
  <g transform="translate(82, 80)">
    <path d="M 8 0 L 36 0 L 50 14 L 50 54 L 8 54 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    <polyline points="36,0 36,14 50,14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" />
    <line x1="16" y1="24" x2="40" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="34" x2="42" y2="34" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="44" x2="32" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Left Thai Text: วางบท / เขียนบท -->
  <text x="56" y="275" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="54" fill="#FFFFFF">วางบท / เขียนบท</text>
  <text x="56" y="352" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">จากไอเดีย สู่บทภาพยนตร์</text>
  <text x="56" y="415" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">ด้วย AI</text>

  <!-- Outer Neon Glowing Frame -->
  <rect x="8" y="8" width="1008" height="496" rx="36" fill="none" stroke="url(#border1)" stroke-width="12" filter="url(#glow1)" />
  <rect x="8" y="8" width="1008" height="496" rx="36" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
</svg>