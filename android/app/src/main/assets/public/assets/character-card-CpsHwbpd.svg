<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <radialGradient id="bg3" cx="70%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1D3D" />
      <stop offset="60%" stop-color="#050C22" />
      <stop offset="100%" stop-color="#020410" />
    </radialGradient>
    <linearGradient id="border3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" />
      <stop offset="50%" stop-color="#1E90FF" />
      <stop offset="100%" stop-color="#FF35D4" />
    </linearGradient>
    <linearGradient id="icon3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="512" rx="40" fill="url(#bg3)" />

  <!-- Stars & Constellations -->
  <circle cx="580" cy="70" r="3.5" fill="#38BDF8" opacity="0.9" filter="url(#glow3)" />
  <circle cx="720" cy="50" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="860" cy="90" r="3" fill="#38BDF8" opacity="0.9" />
  <line x1="580" y1="70" x2="720" y2="50" stroke="#00D8FF" stroke-width="1.5" opacity="0.4" />
  <line x1="720" y1="50" x2="860" y2="90" stroke="#00D8FF" stroke-width="1.5" opacity="0.4" />

  <!-- 3 Character Portraits (Right Side) -->
  <g transform="translate(380, 50)">
    <!-- Right Character: Armored Cyborg -->
    <g transform="translate(360, 60)">
      <!-- Head Helmet -->
      <path d="M 40 40 Q 90 20 140 40 L 155 140 Q 90 190 25 140 Z" fill="#0F172A" stroke="#7C3AED" stroke-width="3" filter="url(#glow3)" />
      <!-- Glowing Visor -->
      <path d="M 45 80 Q 90 95 135 80 L 140 98 Q 90 115 40 98 Z" fill="#EC4899" filter="url(#glow3)" />
      <line x1="45" y1="89" x2="135" y2="89" stroke="#FFFFFF" stroke-width="3" />
      <!-- Shoulders -->
      <path d="M 10 160 L 170 160 L 180 340 L 0 340 Z" fill="#090D1A" stroke="#7C3AED" stroke-width="2" />
    </g>

    <!-- Center/Left Character: Handsome Asian Male Hero -->
    <g transform="translate(40, 20)">
      <!-- Torso / Jacket -->
      <path d="M 20 220 Q 120 190 220 220 L 250 420 L -10 420 Z" fill="#0B132B" stroke="#00D8FF" stroke-width="2.5" />
      <polygon points="80,210 120,280 160,210 135,340 105,340" fill="#1C2541" />
      <!-- Face -->
      <path d="M 70 110 Q 120 180 170 110 L 165 70 Q 120 70 75 70 Z" fill="#E2C9B6" />
      <path d="M 85 115 Q 120 165 155 115 Z" fill="#D4A373" opacity="0.4" />
      <!-- Eyes & Brows -->
      <path d="M 85 95 L 105 92" stroke="#1F2937" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 135 92 L 155 95" stroke="#1F2937" stroke-width="3.5" stroke-linecap="round" />
      <ellipse cx="95" cy="102" rx="4" ry="5" fill="#111827" />
      <ellipse cx="145" cy="102" rx="4" ry="5" fill="#111827" />
      <!-- Nose & Mouth -->
      <line x1="120" y1="102" x2="117" y2="122" stroke="#B08968" stroke-width="2.5" />
      <path d="M 105 138 Q 120 144 135 138" stroke="#8B5E3C" stroke-width="2.5" fill="none" />
      <!-- Hair -->
      <path d="M 55 80 Q 70 10 120 15 Q 170 10 185 80 Q 155 50 120 55 Q 85 50 55 80 Z" fill="#030712" />
      <path d="M 60 70 Q 90 30 110 55 Q 80 40 60 70 Z" fill="#1E293B" />
      <path d="M 140 50 Q 160 30 180 70 Q 160 40 140 50 Z" fill="#1E293B" />
    </g>

    <!-- Middle/Right Character: Silver-Haired Cyber Heroine -->
    <g transform="translate(200, 35)">
      <!-- Shoulders -->
      <path d="M 30 210 Q 110 190 190 210 L 210 400 L 10 400 Z" fill="#1E1B4B" stroke="#E879F9" stroke-width="2" />
      <!-- Face -->
      <path d="M 75 105 Q 110 170 145 105 L 140 65 Q 110 65 80 65 Z" fill="#F8E5D8" />
      <!-- Lips -->
      <path d="M 100 135 Q 110 142 120 135" stroke="#E11D48" stroke-width="3" fill="#FDA4AF" />
      <!-- Eyes -->
      <ellipse cx="94" cy="98" rx="4" ry="5" fill="#0284C7" />
      <ellipse cx="126" cy="98" rx="4" ry="5" fill="#0284C7" />
      <!-- Silver Flowing Hair -->
      <path d="M 55 85 Q 70 0 110 10 Q 150 0 165 85 Q 150 40 110 45 Q 70 40 55 85 Z" fill="#E2E8F0" filter="url(#glow3)" />
      <path d="M 50 85 Q 35 180 60 260 L 80 260 Q 60 180 75 85 Z" fill="#CBD5E1" />
      <path d="M 170 85 Q 185 180 160 260 L 140 260 Q 160 180 145 85 Z" fill="#CBD5E1" />
    </g>
  </g>

  <!-- Left Icon Box (Person) -->
  <rect x="52" y="52" width="112" height="112" rx="28" fill="url(#icon3)" filter="url(#glow3)" />
  <g transform="translate(84, 76)">
    <circle cx="24" cy="18" r="14" fill="#FFFFFF" />
    <path d="M 4 52 C 4 36 14 34 24 34 C 34 34 44 36 44 52 Z" fill="#FFFFFF" />
  </g>

  <!-- Left Thai Text: ตัวละคร -->
  <text x="56" y="275" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="54" fill="#FFFFFF">ตัวละคร</text>
  <text x="56" y="352" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">สร้างและเลือกคาแรกเตอร์</text>
  <text x="56" y="415" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">ให้สไตล์โดดเด่น</text>

  <!-- Outer Neon Glowing Frame -->
  <rect x="8" y="8" width="1008" height="496" rx="36" fill="none" stroke="url(#border3)" stroke-width="12" filter="url(#glow3)" />
  <rect x="8" y="8" width="1008" height="496" rx="36" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
</svg>